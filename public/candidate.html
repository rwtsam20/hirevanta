<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CareerHub Candidate Profile</title>
<style>
body{font-family:Arial;background:#f5f7fb;margin:0;color:#172033}.box{max-width:650px;margin:25px auto;background:white;padding:25px;border-radius:18px;box-shadow:0 5px 25px #0001}h1{margin-top:0}input,textarea{width:100%;box-sizing:border-box;padding:13px;margin:7px 0 12px;border:1px solid #ddd;border-radius:10px}button{width:100%;padding:14px;background:#2563eb;color:white;border:0;border-radius:10px;font-weight:bold;font-size:16px}#msg{margin-top:15px;font-weight:bold}
</style></head><body><div class="box">
<h1>👤 CareerHub Candidate Profile</h1>
<p>Create your professional profile for recruiters.</p>
<input id="name" placeholder="Full Name">
<input id="email" type="email" placeholder="Email">
<input id="phone" placeholder="Phone Number">
<input id="location" placeholder="City / Country">
<input id="skills" placeholder="Skills (e.g. Retail, Sales, Excel)">
<input id="experience" placeholder="Experience">
<input id="education" placeholder="Education">
<textarea id="summary" rows="4" placeholder="Professional Summary"></textarea>
<input id="resume" placeholder="Resume link (optional)">
<button onclick="saveProfile()">Save Profile</button>
<div id="msg"></div></div>
<script>
async function saveProfile(){
 const data={name:name.value.trim(),email:email.value.trim(),phone:phone.value.trim(),location:location.value.trim(),skills:skills.value.trim(),experience:experience.value.trim(),education:education.value.trim(),summary:summary.value.trim(),resume:resume.value.trim()};
 if(!data.name||!data.email){msg.textContent="Name and email are required.";return}
 try{
  const r=await fetch("/api/candidates",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(data)});
  const d=await r.json();msg.textContent=d.message;
 }catch(e){msg.textContent="Server connection failed."}
}
</script></body></html>
