<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CareerHub Candidate</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f4f7fb;color:#172033}
.box{max-width:480px;margin:40px auto;padding:18px}
.card{background:#fff;padding:25px;border-radius:18px;box-shadow:0 5px 25px #0001}
h1{margin-top:0}
input{width:100%;padding:13px;margin:7px 0 12px;border:1px solid #ddd;border-radius:10px}
button{width:100%;padding:13px;border:0;border-radius:10px;background:#2563eb;color:#fff;font-weight:700;margin-top:6px}
.switch{background:#eef2ff;color:#1d4ed8}
#msg{margin-top:15px;text-align:center}
</style>
</head>
<body>
<div class="box">
<div class="card">
<h1>CareerHub 👤</h1>
<p>Create your candidate account</p>

<input id="name" placeholder="Full Name">
<input id="email" type="email" placeholder="Email Address">
<input id="phone" placeholder="Phone Number">
<input id="password" type="password" placeholder="Password">

<button onclick="register()">Create Account</button>
<button class="switch" onclick="login()">Already have an account? Login</button>

<div id="msg"></div>
</div>
</div>

<script>
async function register(){
 const body={
  name:name.value.trim(),
  email:email.value.trim(),
  phone:phone.value.trim(),
  password:password.value
 };
 if(!body.name||!body.email||!body.password){
  msg.innerText="Name, email and password are required";
  return;
 }

 const r=await fetch("/api/candidate/register",{
  method:"POST",
  headers:{"Content-Type":"application/json"},
  body:JSON.stringify(body)
 });
 const d=await r.json();

 if(d.ok){
  localStorage.setItem("careerhub_candidate",JSON.stringify(d.candidate));
  location.href="/candidate-dashboard.html";
 }else msg.innerText=d.message||"Registration failed";
}

async function login(){
 const e=prompt("Enter your email");
 const p=prompt("Enter your password");
 if(!e||!p)return;

 const r=await fetch("/api/candidate/login",{
  method:"POST",
  headers:{"Content-Type":"application/json"},
  body:JSON.stringify({email:e,password:p})
 });
 const d=await r.json();

 if(d.ok){
  localStorage.setItem("careerhub_candidate",JSON.stringify(d.candidate));
  location.href="/candidate-dashboard.html";
 }else alert(d.message||"Invalid login");
}
</script>
</body>
</html>
